const order=[1, 2, 34, 30, 29, 27, 26, 32, 31, 33, 28, 25, 24, 22, 21, 23, 20, 19, 18, 17, 16, 15, 14, 13, 12, 11, 10, 9, 8, 7, 6, 5, 4, 3];
let route=[],idx=0;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function barcode(v){
 if(!v)return '';
 // Code 128-B, rendered with a fixed module width and quiet zones for reliable phone scanning.
 const codes=[104];
 for(let i=0;i<v.length;i++)codes.push(v.charCodeAt(i)-32);
 let sum=104;
 for(let i=0;i<v.length;i++)sum+=(v.charCodeAt(i)-32)*(i+1);
 codes.push(sum%103,106);
 const p=["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","223112","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
 const mw=2, quiet=10, top=4, h=68;
 let x=quiet*mw, b='';
 codes.forEach(c=>{
   let black=true;
   for(const ch of p[c]){
     const w=parseInt(ch,10)*mw;
     if(black)b+=`<rect x="${x}" y="${top}" width="${w}" height="${h}"></rect>`;
     x+=w; black=!black;
   }
 });
 x+=quiet*mw;
 return `<svg viewBox="0 0 ${x} 78" width="${x}" height="78" preserveAspectRatio="xMidYMid meet" shape-rendering="crispEdges" aria-label="Barcode ${esc(v)}"><rect width="100%" height="100%" fill="#fff"></rect>${b}</svg>`;
}
const box=document.getElementById('stops');
stops.forEach(s=>box.innerHTML+=`<div class="card ${s.type==='Apotheke'?'apo':'opt'}"><label><input type="checkbox" id="c${s.id}">${String(s.id).padStart(2,'0')}. ${esc(s.name)}</label><div>${esc(s.addr)}</div></div>`);
function renderStopList(){const sl=document.getElementById('stopList');sl.innerHTML='';route.forEach((s,i)=>{sl.innerHTML+=`<div class="card ${s.type==='Apotheke'?'apo':'opt'}" id="stop-${s.id}"><label>${String(s.id).padStart(2,'0')}. ${esc(s.name)}</label><div>${esc(s.addr)}</div><div class="bar">${barcode(s.barcode)}<div class="num">${esc(s.barcode)}</div></div><span class="badge">Schlüssel: ${esc(s.key)}</span><span class="badge">Farbe: ${esc(s.color)}</span><button class="primary" onclick="goToStop(${i})">🧭 Diesen Stopp anfahren</button></div>`});}
function goToStop(i){idx=i;show();document.getElementById('currentBox').scrollIntoView({behavior:'smooth',block:'start'});}
document.getElementById('start').onclick=()=>{const selected=stops.filter(s=>document.getElementById('c'+s.id).checked);if(!selected.length){alert('Bitte mindestens einen Stopp anhaken.');return}const rank=new Map(order.map((id,i)=>[id,i]));route=selected.slice().sort((a,b)=>rank.get(a.id)-rank.get(b.id));idx=0;document.getElementById('list').style.display='none';document.getElementById('nav').style.display='block';renderStopList();show()};
function show(){let s=route[idx];document.getElementById('count').textContent=`Stopp ${idx+1} von ${route.length} · Tour 70`;document.getElementById('name').textContent=`${String(s.id).padStart(2,'0')}. ${s.name}`;document.getElementById('addr').textContent=s.addr;document.getElementById('meta').innerHTML=`<div class="bar">${barcode(s.barcode)}<div class="num">${esc(s.barcode)}</div></div><span class="badge">Schlüssel: ${esc(s.key)}</span><span class="badge">Farbe: ${esc(s.color)}</span>`;document.getElementById('prev').disabled=idx===0}
document.getElementById('maps').onclick=()=>{let s=route[idx];window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(s.addr),'_blank')};
document.getElementById('prev').onclick=()=>{if(idx>0){idx--;show()}};
document.getElementById('next').onclick=()=>{if(++idx>=route.length){alert('Tour beendet');return}show();document.getElementById('currentBox').scrollIntoView({behavior:'smooth',block:'start'})};
document.getElementById('backToSelection').onclick=()=>{document.getElementById('nav').style.display='none';document.getElementById('list').style.display='block'};
</script></body></html>
